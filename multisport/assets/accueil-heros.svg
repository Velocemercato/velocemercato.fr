<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 365" preserveAspectRatio="xMidYMid slice"><title>Véloce Multisport — Le même héros dans plusieurs univers sportifs</title><desc>Illustration originale en bande dessinée, mascotte VM numéro 87, bandes rouges, orange et bleues pour le foot, la NBA, la NFL, la F1 et le tennis.</desc><defs><symbol id="vm-portrait" viewBox="0 0 1000 750">
