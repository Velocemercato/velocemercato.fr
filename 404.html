<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable – Véloce Mercato</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/app/foot-apple.png">
<style>
:root{--bg:#07070b;--surface:#14141c;--ink:#f5f2ea;--muted:#b9b4a6;--red:#e3122b;--gold:#f4c430}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#3a0710 0,var(--bg) 60%);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:560px;width:100%;background:var(--surface);border:2px solid var(--red);border-radius:18px;padding:26px 22px;box-shadow:0 0 28px rgba(227,18,43,.45);text-align:center}
h1{margin:0 0 8px;font:900 italic 2rem/1.1 Impact,"Arial Black",sans-serif;color:var(--gold);text-transform:uppercase}
p{margin:0 0 14px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
a{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;text-decoration:none}
a.alt{background:transparent;border:2px solid var(--gold);color:var(--gold)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1 id="titre">Page introuvable</h1>
<p id="texte">Cette page n'existe pas ou plus.</p>
<nav aria-label="Continuer sur Véloce Mercato">
<a href="/">⚽ Les actus foot du jour</a>
<a class="alt" href="/foot-amateur/">Foot amateur de ta région</a>
<a class="alt" href="/multisport/">VM Multisport</a>
<a class="alt" href="/mangas/">VM MANGAS</a>
</nav>
</main>
<script>
// Les brèves s'effacent chaque matin à 5 h : un lien partagé hier mène ici.
if (/^\/a\//.test(location.pathname)) {
  document.getElementById('titre').textContent = 'Cette actu date d’hier';
  document.getElementById('texte').textContent = 'Chaque matin à 5 h, Véloce Mercato repart à neuf : les brèves de la veille s’effacent. Voici celles du jour.';
}
</script>
</body>
</html>
