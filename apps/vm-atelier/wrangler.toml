name = "vm-atelier"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Coordonnées publiques affichées aux clients (à remplir par Romain, facultatif).
[vars]
CONTACT_EMAIL = ""
CONTACT_TEL = ""
# Accord écrit de Romain (13/11/2026 : « tu peux valider Stripe ») : l'encaissement réel est autorisé
# dès que le secret STRIPE_SECRET_KEY contient une clé live (sk_live_…). Avec une clé de test, rien ne change.
STRIPE_REEL = "oui"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
