<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programme VM Invest</title>
<meta name="description" content="Les publications VM Invest du jour, prêtes à copier-coller sur TikTok, Snapchat ou ailleurs.">
<meta name="robots" content="noindex"><meta name="theme-color" content="#04060f">
<link rel="icon" href="/app/univers-192.png">
<style>
:root{--bg:#0b1533;--card:#121d44;--ink:#fff;--muted:#c9d0ea;--gold:#f4cf55;--red:#ff4757;--blue:#3f7bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px;background:linear-gradient(135deg,#1d3fb8,#0b1533 60%,#5a0a18);border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
main{max-width:760px;margin:0 auto;padding:16px}
.day{margin:22px 0 8px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.post{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--card);border:2px solid #2a3a78;border-radius:16px;padding:12px;margin:10px 0}
.post.now{border-color:var(--gold);box-shadow:0 0 0 3px #f4cf5544}
.media{width:120px;aspect-ratio:9/16;border-radius:12px;object-fit:cover;background:#000}
.media.img{aspect-ratio:1;align-self:start}
.h{font-weight:900;font-size:1.05rem}.t{display:inline-block;font-size:.72rem;font-weight:900;border-radius:6px;padding:1px 7px;margin-right:6px}
.t.video{background:var(--red)}.t.carte{background:var(--blue)}
pre{white-space:pre-wrap;font:13px/1.45 system-ui,sans-serif;background:#0b1533;border:1px dashed #4a5a98;border-radius:10px;padding:9px;margin:8px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,a.b{font:800 .9rem system-ui,sans-serif;border:0;border-radius:999px;padding:9px 14px;background:var(--gold);color:#0b1533;text-decoration:none;cursor:pointer}
a.b.alt{background:#fff}
.tip{background:#121d44;border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.92rem}
@media(max-width:480px){.post{grid-template-columns:92px 1fr}.media{width:92px}}
</style></head><body>
<header><h1>📅 Programme VM Invest</h1><p>Facebook et Instagram : publiés automatiquement. Ici : copie-colle sur TikTok, Snapchat…</p></header>
<main>
<div class="tip">1) <b>📋 Copier le texte</b> · 2) <b>⬇️ Enregistrer</b> la vidéo ou l'image · 3) Publie sur TikTok/Snap et colle le texte. Ajoute cette page à ton écran d'accueil.</div>
<div id="liste"></div>
</main>
<script>
var D={"debut": "2026-10-26", "heures": {"2026-10-26": [16, 19, 21, 23]}, "defaut": [8, 12, 16, 20], "projets": [["VM Emploi", "emploi", "/emploi/", "Les offres d’emploi près de chez toi, simples à lire."], ["AlloLivre", "allolivre", "/allolivre/", "Livraison et entraide entre voisins."], ["VM Studio", "studio", "/web-studio.html", "Sites internet et visuels pour les pros, avec des prix clairs."], ["VM Actus", "actus", "/actus/", "L’actu générale en brèves sourcées, toute la journée."], ["VM Gaming", "gaming", "/vm-gaming/", "Jeux vidéo, actu gaming et communauté de joueurs."], ["La Pastille TV", "tv", "/studio.html#tv", "Les JT foot, actu et gaming en vidéo, générés par IA."], ["VM CV", "cv", "/cv/", "Fais ton CV pro gratuitement, en quelques minutes."], ["VM Shop", "annonces", "/shop/", "Les petites annonces de la communauté VM."], ["VM Recettes", "recettes", "/recettes/", "Une idée de recette chaque jour."], ["VM Météo & Découverte", "meteo", "/meteo/", "La météo et des idées de sorties."], ["VM Sport & randonnée", "sport", "/sport/", "Sport, balades et randonnées à faire."], ["VM Pro Local", "pro", "/pro/", "Les pros et artisans de chez nous."], ["VM Produits locaux", "produits", "/produits-locaux/", "Acheter local, près de chez toi."], ["VM Belfort", "belfort", "/belfort/", "L’info et les bons plans du coin."], ["Pépite FC", "pepite", "/pepite/", "Repère et fais connaître les jeunes talents du foot."], ["VM Radio", "radio", "/radio.html", "La radio de l’univers VM."]], "teasers": [["VM Univers", "vm-univers", "https://vmunivers.fr/", "Tous les projets du groupe VM, réunis au même endroit."], ["VM Studio", "vm-studio", "https://velocemercato.fr/web-studio.html", "Sites internet et visuels pour les pros, avec des prix clairs."], ["VM Actus", "vm-actus", "https://velocemercato.fr/actus/", "L’actu en brèves sourcées, toute la journée."], ["VM Gaming", "vm-gaming", "https://velocemercato.fr/vm-gaming/", "Jeux vidéo, actu gaming et communauté de joueurs."], ["VM Studio — votre site internet", "vm-bureaux", "https://velocemercato.fr/web-studio.html", "Ton site pro clé en main, simple et à prix clair."]]};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function heures(d){return D.heures[iso(d)]||D.defaut}
function jours(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5)}
var debut=new Date(D.debut+'T12:00:00');
function contenu(d,h){var hs=heures(d),r=hs.indexOf(h),n=jours(debut,d)*4+(r<0?0:r);
 if(n%2===1){var t=D.teasers[(Math.floor(n/2)+3)%D.teasers.length];return{type:'video',name:t[0],url:t[2],pitch:t[3],video:'/media/promos/'+t[1]+'-vertical.mp4'}}
 var p=D.projets[Math.floor(n/2)%D.projets.length];return{type:'carte',name:p[0],icon:p[1],url:'https://velocemercato.fr'+p[2],pitch:p[3]}}
function tag(n){return n.split('—')[0].replace(/[^A-Za-z]/g,'')}
function texte(it){var u='👉 Lien en bio';
 if(it.type==='video')return '🎬 '+it.name+'\n\n'+it.pitch+'\n\n'+u+'\nTous les projets du groupe : vmunivers.fr\nVidéo réalisée avec l’aide de l’IA.\n\n#VMUnivers #VM #'+tag(it.name);
 return '✨ Un projet du groupe VM : '+it.name+'\n\n'+it.pitch+'\n\n'+u+'\nTous les projets du groupe : vmunivers.fr\n\n#VMUnivers #VM #'+tag(it.name)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var L=document.getElementById('liste'),now=new Date(),html='';
for(var k=0;k<3;k++){var d=new Date(now);d.setDate(d.getDate()+k);
 html+='<div class="day">'+(k===0?'Aujourd’hui':k===1?'Demain':'Après-demain')+' · '+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</div>';
 heures(d).forEach(function(h){var it=contenu(d,h),tx=texte(it),cur=k===0&&now.getHours()===h;
  var m=it.type==='video'?'<video class="media" src="'+it.video+'" poster="'+it.video.replace('.mp4','.jpg')+'" preload="none" controls playsinline></video>':'<img class="media img" src="/app/'+it.icon+'-512.png" alt="">';
  var dl=it.type==='video'?it.video:'/app/'+it.icon+'-512.png';
  html+='<div class="post'+(cur?' now':'')+'">'+m+'<div><div class="h">'+h+' h · <span class="t '+it.type+'">'+(it.type==='video'?'🎬 VIDÉO':'✨ PROJET')+'</span>'+esc(it.name)+'</div>'+
   '<pre>'+esc(tx)+'</pre><div class="btns"><button type="button" data-t="'+esc(tx)+'">📋 Copier le texte</button><a class="b alt" href="'+dl+'" download>⬇️ Enregistrer</a></div></div></div>'})}
L.innerHTML=html;
L.addEventListener('click',function(e){var b=e.target.closest('button[data-t]');if(!b)return;
 navigator.clipboard.writeText(b.getAttribute('data-t')).then(function(){b.textContent='✅ Copié !';setTimeout(function(){b.textContent='📋 Copier le texte'},1800)})});
</script>
</body></html>
