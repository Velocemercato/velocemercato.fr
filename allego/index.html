<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allego – Scanne avant d’acheter</title>
<meta name="description" content="Prototype Allego : vérifier un article d’occasion avant de l’acheter entre particuliers. Rien n’est conservé.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f3d3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d3a'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='%23b8f2c9' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#14201f;--muted:#55625f;--line:#d5dbd8;--brand:#0f3d3a;--brand-ink:#fff;--accent:#1f7a5a;
--good:#e3f4ea;--good-b:#1f7a5a;--warn:#fff1dc;--warn-b:#b35c00;--none:#eef0f2;--none-b:#5b6670;--demo:#ffe14d;--amb:#ffe08a;--focus:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#16201f;--ink:#e8efed;--muted:#a3b2ae;--line:#2c3a38;--brand:#b8f2c9;--brand-ink:#0e1514;--accent:#7fd8a8;
--good:#163626;--good-b:#7fd8a8;--warn:#3a2810;--warn-b:#ffb35c;--none:#1f2729;--none-b:#a3b2ae;--amb:#6b5410;--focus:#8ab4ff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--brand);color:var(--brand-ink)}
.top a{color:inherit;text-decoration:none;font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.top small{font-weight:600;opacity:.85;font-size:.8rem;margin-left:6px}
.top button{background:transparent;color:inherit;border:2px solid currentColor;border-radius:10px;font:700 .85rem system-ui;padding:8px 10px;min-height:40px}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:2rem;line-height:1.1;margin:8px 0}
h2{font-size:1.4rem;line-height:1.2;margin:14px 0 8px}
h3{font-size:1.1rem;margin:0 0 8px}
h4{font-size:.95rem;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:.9rem}.center{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;word-break:break-all}
.hero{text-align:center;padding:18px 0 6px}
.hero p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:12px 18px;margin:5px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 1rem system-ui,sans-serif;text-decoration:none;cursor:pointer;width:100%}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.big{min-height:72px;font-size:1.3rem;border-radius:18px}
.btn.danger{color:var(--warn-b);border-color:var(--warn-b)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font:600 1rem system-ui;text-decoration:underline;padding:10px 0;cursor:pointer;min-height:44px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 calc(8px + env(safe-area-inset-bottom));margin-bottom:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.privacy{background:var(--good);border-left:5px solid var(--good-b);border-radius:12px;padding:10px 12px;font-size:.92rem}
.note{background:var(--none);border-left:5px solid var(--none-b);border-radius:12px;padding:10px 12px;font-size:.95rem}
.demo{position:sticky;top:60px;z-index:4;background:var(--demo);color:#1a1400;border:3px dashed #1a1400;border-radius:12px;padding:8px 12px;margin:4px 0 8px;font-size:.92rem}
body.is-demo main{background-image:repeating-linear-gradient(-45deg,transparent 0 40px,rgba(255,225,77,.08) 40px 80px)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--none);color:var(--none-b);vertical-align:middle}
.tag.complet{background:var(--good);color:var(--good-b)}.tag.auto{background:var(--amb);color:inherit}
.grp{font-size:.95rem;color:var(--muted);margin-top:12px}
.cats{list-style:none;padding:0;margin:0}.cats li{padding:6px 0;border-bottom:1px solid var(--line)}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:55vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-msg{position:absolute;left:8px;right:8px;bottom:8px;margin:0;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:6px 10px;font-size:.9rem}
.thumbs{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.thumbs li{position:relative}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:1.3rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 .95rem system-ui;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item img{width:76px;height:76px;object-fit:cover;border-radius:10px}
.codeonly{display:grid;place-items:center;width:76px;height:76px;border-radius:10px;background:var(--none);font-size:2rem}
label{display:block;font-weight:700;font-size:.95rem;margin:12px 0 4px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:400 1.05rem system-ui,sans-serif;padding:12px;min-height:50px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;text-transform:uppercase}
.cc{margin:2px 0 0;font-size:.9rem;min-height:0}
.amb{background:var(--amb);border-radius:3px;padding:0 1px;font-weight:800}
details.src>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
summary{cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--none);padding:4px;border-radius:14px;margin:8px 0}
.tabs button{min-height:48px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:700 .95rem system-ui;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
.cmp caption{text-align:left;font-weight:700;padding-bottom:4px}
.cmp th,.cmp td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top;text-align:left}
.cmp th{width:30%}.cmp hr{border:0;border-top:1px dashed var(--line);margin:4px 0}
.st{width:24%;font-weight:700;font-size:.85rem}.st.diff{color:var(--warn-b)}.st.same::before{content:"= identique";color:var(--good-b)}.st.single,.st.na{color:var(--muted)}
.plain{list-style:none;padding:0;margin:0}
.res{border-radius:16px;margin:14px 0;padding:14px;border:2px solid var(--none-b);background:var(--card)}
.res header{margin:-14px -14px 10px;padding:12px 14px;border-radius:14px 14px 0 0;background:var(--none)}
.res.good{border-color:var(--good-b)}.res.good header{background:var(--good)}
.res.warn{border-color:var(--warn-b)}.res.warn header{background:var(--warn)}
.res .k{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.res h3{font-size:1.25rem;margin:2px 0}
.fl{list-style:none;padding:0;margin:0}
.f{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.f .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem;background:var(--none);color:var(--none-b)}
.f.ok .ic{background:var(--good);color:var(--good-b)}.f.alerte .ic,.f.attention .ic{background:var(--warn);color:var(--warn-b)}
.f p{font-size:.92rem}.ask{font-style:italic}.src-l{color:var(--muted);font-size:.8rem!important}
.q{border:0;border-top:1px solid var(--line);padding:10px 0;margin:0}
.q legend{font-weight:600;padding:0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;clear:both}
.seg button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem system-ui;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.official{border:2px solid var(--accent)}
.official .btn{margin:4px 0;flex-wrap:wrap}
.btn .mono{word-break:normal}
label.radio{display:flex;align-items:flex-start;gap:10px;font-weight:500;min-height:44px;margin:4px 0;padding:8px 0}
label.radio input{width:24px;height:24px;min-height:0;margin:2px 0 0;flex:none}
.busy{position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px;text-align:center;font-weight:700;max-width:608px;margin:auto}
footer{max-width:640px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
h1:focus,h2:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a href="./" id="homeLink">Allego<small>prototype</small></a>
  <button type="button" id="wipeTop">Tout effacer</button>
</header>
<main id="app" aria-live="off"><noscript><p>Allego a besoin de JavaScript pour fonctionner.</p></noscript></main>
<footer>Prototype. Allego ne certifie jamais qu’un article est authentique ou non volé, et n’interroge aucune base de fabricant, de police ou d’assureur. Aucune donnée n’est conservée.</footer>
<script src="categories.js"></script>
<script src="app.js"></script>
</body>
</html>
