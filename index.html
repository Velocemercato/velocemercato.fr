<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b09">
  <meta name="robots" content="noindex, nofollow">
  <title>Véloce Mercato — Aperçu de l’accueil</title>
  <style>
    body {
      margin: 0;
      background: #100b09;
    }

    main {
      position: relative;
    }

    picture,
    .accueil {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    .zone-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .zone-logo :is(rect, circle) {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all;
      cursor: pointer;
    }

    .zone-logo a:hover :is(rect, circle),
    .zone-logo a:focus-visible :is(rect, circle) {
      stroke: #ffd875;
    }

    .zone-logo--portrait {
      display: none;
    }

    @media (orientation: portrait) {
      .zone-logo--paysage {
        display: none;
      }

      .zone-logo--portrait {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Véloce Mercato">
    <picture>
      <source media="(orientation: portrait)" srcset="img/accueil-bureau-veloce-portrait.webp">
      <img class="accueil" src="img/accueil-bureau-veloce.webp"
        alt="Bureau aux lumières dorées, avec des trophées, un globe et une vue sur la tour Eiffel au coucher du soleil. L’enseigne Véloce Mercato domine le décor.">
    </picture>
    <svg class="zone-logo zone-logo--paysage" viewBox="0 0 720 405" preserveAspectRatio="xMidYMid slice">
      <a href="https://vmunivers.fr/" aria-label="VM Univers, le site vitrine" tabindex="0">
        <rect x="320" y="221" width="66" height="55" rx="10"/>
      </a>
      <a href="https://velocemercato.fr/actus/" aria-label="VM Actus et Pronos — ouvrir VM Actus" tabindex="0">
        <circle cx="601" cy="261" r="54"/>
      </a>
    </svg>
    <svg class="zone-logo zone-logo--portrait" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
      <a href="https://vmunivers.fr/" aria-label="VM Univers, le site vitrine" tabindex="0">
        <rect x="158" y="374" width="52" height="48" rx="9"/>
      </a>
      <a href="https://velocemercato.fr/actus/" aria-label="VM Actus et Pronos — ouvrir VM Actus" tabindex="0">
        <circle cx="304" cy="390" r="33"/>
      </a>
    </svg>
  </main>
</body>
</html>
