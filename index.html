<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Véloce Mercato — Aperçu de l’accueil</title>
  <style>
    body {
      margin: 0;
      background: #100b09;
    }

    .accueil {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      object-fit: cover;
      object-position: center;
    }

    @media (orientation: portrait) {
      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
      }

      .accueil {
        height: auto;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Véloce Mercato">
    <img class="accueil" src="img/accueil-bureau-veloce.webp"
      alt="Bureau aux lumières dorées, avec des trophées, un globe et une vue sur la tour Eiffel au coucher du soleil. Sur le mur, l’enseigne Véloce Mercato.">
  </main>
</body>
</html>
