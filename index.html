<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b09">
  <meta name="robots" content="noindex, nofollow">
  <title>Véloce Mercato — Aperçu de l’accueil</title>
  <style>
    body {
      margin: 0;
      background: #100b09;
    }

    main {
      position: relative;
    }

    picture,
    .accueil {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    .zone-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .zone-logo a > :is(rect, circle) {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all;
      cursor: pointer;
    }

    .zone-logo a:hover > :is(rect, circle),
    .zone-logo a:focus-visible > :is(rect, circle) {
      stroke: #ffd875;
    }

    .zone-logo--portrait {
      display: none;
    }

    @media (orientation: portrait) {
      .zone-logo--paysage {
        display: none;
      }

      .zone-logo--portrait {
        display: block;
      }
    }

    .reseaux {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      box-sizing: border-box;
      width: max-content;
      max-width: calc(100% - 12px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid #d7ab6477;
      border-radius: 22px;
      background: #100b09e8;
      box-shadow: 0 6px 24px #0008;
    }

    .reseaux a {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 17px;
      color: var(--logo-color);
    }

    .reseaux a:hover,
    .reseaux a:focus-visible {
      background: #ffffff1f;
      outline: 2px solid #ffd875;
      outline-offset: -2px;
    }

    .reseaux svg {
      width: 23px;
      height: 23px;
    }

    @media (max-width: 340px) {
      .reseaux { gap: 0; }
      .reseaux a { width: 41px; }
    }


    .zone-enseigne {
      pointer-events: all;
    }

    .ouvrir-veloce {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .ouvrir-veloce:hover,
    .ouvrir-veloce:focus-visible {
      border-color: #ffd875;
      outline: none;
    }

    #espace-veloce {
      box-sizing: border-box;
      width: min(420px, calc(100% - 32px));
      min-height: 180px;
      padding: 26px;
      border: 1px solid #d7ab64;
      border-radius: 20px;
      background: #100b09;
      color: #fff2cf;
      font: 1rem system-ui, sans-serif;
    }

    #espace-veloce::backdrop {
      background: #100b09bb;
    }

    #espace-veloce h1 {
      margin: 0 48px 0 0;
      font-size: 1.4rem;
    }

    #espace-veloce form {
      position: absolute;
      top: 12px;
      right: 12px;
      margin: 0;
    }

    #espace-veloce button {
      width: 44px;
      height: 44px;
      border: 1px solid #d7ab64;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font: 1.4rem system-ui, sans-serif;
      cursor: pointer;
    }

    #espace-veloce button:focus-visible {
      outline: 2px solid #ffd875;
      outline-offset: 2px;
    }

    .zone-logo .acces-cadre {
      pointer-events: all;
      cursor: pointer;
    }

    .acces-cadre:hover .cadre-bord,
    .acces-cadre:focus-visible .cadre-bord {
      stroke: #fff1bd;
      stroke-width: 2.5;
    }
  </style>
</head>
