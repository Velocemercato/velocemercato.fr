<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b09">
  <meta name="robots" content="noindex, nofollow">
  <title>Véloce Mercato — Aperçu de l’accueil</title>
  <style>
    body {
      margin: 0;
      background: #100b09;
    }

    main {
      position: relative;
    }

    picture,
    .accueil {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    .zone-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .zone-logo :is(rect, circle) {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all;
      cursor: pointer;
    }

    .zone-logo a:hover :is(rect, circle),
    .zone-logo a:focus-visible :is(rect, circle) {
      stroke: #ffd875;
    }

    .zone-logo--portrait {
      display: none;
    }

    @media (orientation: portrait) {
      .zone-logo--paysage {
        display: none;
      }

      .zone-logo--portrait {
        display: block;
      }
    }

    .reseaux {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      box-sizing: border-box;
      width: max-content;
      max-width: calc(100% - 12px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid #d7ab6477;
      border-radius: 22px;
      background: #100b09e8;
      box-shadow: 0 6px 24px #0008;
    }

    .reseaux a {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 17px;
      color: var(--logo-color);
    }

    .reseaux a:hover,
    .reseaux a:focus-visible {
      background: #ffffff1f;
      outline: 2px solid #ffd875;
      outline-offset: -2px;
    }

    .reseaux svg {
      width: 23px;
      height: 23px;
    }

    @media (max-width: 340px) {
      .reseaux { gap: 0; }
      .reseaux a { width: 41px; }
    }

    .legende-globe {
      fill: #fff2cf;
      stroke: #160d07;
      stroke-width: 2px;
      paint-order: stroke fill;
      font: 700 9px system-ui, sans-serif;
      pointer-events: visiblePainted;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main aria-label="Véloce Mercato">
    <picture>
      <source media="(orientation: portrait)" srcset="img/accueil-bureau-veloce-portrait.webp">
      <img class="accueil" src="img/accueil-bureau-veloce.webp"
        alt="Bureau aux lumières dorées, avec des trophées, un globe et une vue sur la tour Eiffel au coucher du soleil. L’enseigne Véloce Mercato domine le décor.">
    </picture>
    <svg class="zone-logo zone-logo--paysage" viewBox="0 0 720 405" preserveAspectRatio="xMidYMid slice">
      <a href="https://vmunivers.fr/" aria-label="VM Univers, le site vitrine" tabindex="0">
        <rect x="320" y="221" width="66" height="55" rx="10"/>
      </a>
      <a href="https://velocemercato.fr/actus/" aria-label="VM Actus et Pronos — ouvrir VM Actus" tabindex="0">
        <circle cx="601" cy="261" r="54"/>
        <text class="legende-globe" x="601" y="328" text-anchor="middle" aria-hidden="true">VM Actus et Pronos</text>
      </a>
    </svg>
    <svg class="zone-logo zone-logo--portrait" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
      <a href="https://vmunivers.fr/" aria-label="VM Univers, le site vitrine" tabindex="0">
        <rect x="158" y="374" width="52" height="48" rx="9"/>
      </a>
      <a href="https://velocemercato.fr/actus/" aria-label="VM Actus et Pronos — ouvrir VM Actus" tabindex="0">
        <circle cx="304" cy="390" r="33"/>
        <text class="legende-globe" x="313" y="441" text-anchor="end" aria-hidden="true">VM Actus et Pronos</text>
      </a>
    </svg>

      </a>
      <a href="https://www.twitch.tv/velocemercato" target="_blank" rel="noopener noreferrer" aria-label="Twitch Véloce Mercato" title="Twitch" style="--logo-color: #c29aff">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.3 2 2.6 6.3v15.1h5.2V24h2.9l2.8-2.6h4.2L23.4 16V2H4.3zm17.1 13-3.2 3.2h-5.2l-2.8 2.6v-2.6H5.9V3.9h15.5V15zm-3.2-6.6v5.7h-1.9V8.4h1.9zm-5.2 0v5.7h-1.9V8.4H13z"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
