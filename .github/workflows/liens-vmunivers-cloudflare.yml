name: Publier VM Univers sur Cloudflare
# Déploie la révision VM Univers validée sur le domaine public.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/liens-vmunivers-cloudflare.yml']
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: vmunivers-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Velocemercato/vmunivers
          ref: main
          persist-credentials: false
      - name: Identifier la révision source
        run: echo "VM_UNIVERS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Comparer la version publique
        id: check
        run: |
          version=$(curl -fsSL --max-time 15 "https://vmunivers.fr/version.txt?r=$GITHUB_RUN_ID" 2>/dev/null | head -c 40 || true)
          if [ "$version" = "$VM_UNIVERS_SHA" ]; then
            echo 'deploy=no' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=yes' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.deploy == 'yes'
        with:
          node-version: '22'
      - name: Publier la révision vérifiée
        if: steps.check.outputs.deploy == 'yes'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir "$RUNNER_TEMP/vmunivers-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vmunivers-site"
          echo "$VM_UNIVERS_SHA" > "$RUNNER_TEMP/vmunivers-site/version.txt"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/vmunivers-site" --project-name vmunivers --branch main --commit-hash "$VM_UNIVERS_SHA"
      - name: Controler le domaine
        run: |
          for i in $(seq 1 12); do
            version=$(curl -fsSL --max-time 15 "https://vmunivers.fr/version.txt?r=$RANDOM" 2>/dev/null | head -c 40 || true)
            test "$version" = "$VM_UNIVERS_SHA" && { echo 'Version VM Univers publiée.'; exit 0; }
            sleep 10
          done
          echo '::error::Version non confirmee sur vmunivers.fr.'
          exit 1
