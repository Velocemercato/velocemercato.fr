name: VM · Diffuser les conseils du 21 novembre
on:
  push:
    branches: [main]
    paths: ['.github/workflows/conseils-21-meta.yml']
permissions:
  contents: write
concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Charger les accès existants
        run: |
          python -m pip install --quiet 'cryptography==50.0.0'
          git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/vm-broadcast-state"
      - name: Diffuser le visuel public et vérifier les liens
        run: python tools/publier_conseils_21.py
