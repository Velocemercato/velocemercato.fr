name: Publier Véloce Mercato sur Cloudflare
# Le domaine velocemercato.fr est servi par le projet Cloudflare Pages « velocemercato ».
# Toutes les 20 minutes, ce robot compare la version en ligne (version.txt) à main
# et publie seulement si le site a changé. Les accès manquants sont signalés en erreur.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/deployer-accueil-cloudflare.yml', 'index.html', 'assets/**', 'tools/prepare_public_site.py', 'multisport/**', 'actus/**', 'vm-gaming/**', 'studio.html']
permissions:
  contents: read
concurrency:
  group: velocemercato-cloudflare
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comparer la version en ligne
        id: check
        shell: bash
        run: |
          set -euo pipefail
          en_ligne=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://velocemercato.fr/version.txt?r=$GITHUB_RUN_ID" 2>/dev/null | head -c 40 || true)
          if [[ "$en_ligne" == "$GITHUB_SHA" ]]; then
            echo 'Le domaine affiche déjà cette version.'
            echo "deployer=non" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID absents : publication impossible (voir docs/PASSATION_VM_2026-11-10.md)."
            exit 1
          else
            echo "deployer=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.deployer == 'oui'
        with:
          node-version: '22'
      - name: Publier
        if: steps.check.outputs.deployer == 'oui'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/velocemercato-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/velocemercato-site"
          python tools/prepare_public_site.py "$RUNNER_TEMP/velocemercato-site"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/velocemercato-site/version.txt"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/velocemercato-site" --project-name velocemercato --branch main --commit-hash "$GITHUB_SHA"
      - name: Contrôler le domaine
        if: steps.check.outputs.deployer == 'oui'
        shell: bash
        run: |
          for i in $(seq 1 12); do
            v=$(curl -fsSL --max-time 15 "https://velocemercato.fr/version.txt?r=$RANDOM" 2>/dev/null | head -c 40 || true)
            [[ "$v" == "$GITHUB_SHA" ]] && { echo "En ligne : $v"; exit 0; }
            sleep 10
          done
          echo "::error::Déployé, mais velocemercato.fr n'affiche pas encore $GITHUB_SHA (domaine relié à un autre projet ?)."
          exit 1

