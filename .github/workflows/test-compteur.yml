name: Test compteur (temporaire)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://countapi.mileshilliard.com/api/v1
          K=velocemercato-test-$(date +%s)
          for u in "get/$K" "hit/$K" "hit/$K" "get/$K"; do
            curl -s -i -m 15 -H 'Origin: https://velocemercato.fr' "$B/$u" | grep -iE '^HTTP|access-control-allow-origin|^\{' | tr '\r\n' '  ' | sed "s#^#::notice::$u => #"; echo
          done
