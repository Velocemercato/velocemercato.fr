name: Prepare news catch-up without publishing
on:
  push:
    branches: [codex/rattrapage-7-nov]
permissions:
  contents: read
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rubric: foot
            script: update_news.py
            feed: articles.json
          - rubric: actus
            script: update_actus.py
            feed: actus/news.json
          - rubric: gaming
            script: update_gaming.py
            feed: vm-gaming/news.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet trafilatura
      - name: Generate sourced articles in a temporary checkout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VM_RATTRAPAGE: '1'
          FEED: ${{ matrix.feed }}
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          cp "$FEED" /tmp/before.json
          python "$SCRIPT"
          mkdir -p edition
          python - <<'PY'
          import json, os, pathlib, urllib.parse
          before = {a['id'] for a in json.loads(pathlib.Path('/tmp/before.json').read_text())}
          def valid(a):
              return a.get('id') and a['id'] not in before and a.get('titre') and a.get('texte') and any(urllib.parse.urlsplit(s.get('url', '')).scheme == 'https' for s in a.get('sources', []))
          articles = [a for a in json.loads(pathlib.Path(os.environ['FEED']).read_text()) if valid(a)]
          pathlib.Path('edition/nouveaux.json').write_text(json.dumps(articles, ensure_ascii=False, indent=2) + '\n')
          print(f'NEW_SOURCED_ARTICLES={len(articles)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rattrapage-${{ matrix.rubric }}
          path: edition/nouveaux.json
          retention-days: 7
