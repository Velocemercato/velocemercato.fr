name: VM - Campagne quotidienne VÉLOCE TEAM
# Chaque jour vers 17 h 41 (Paris, heure d'hiver) : publie le jour prévu dans campagnes/calendrier.json.
# Heineguez corrige le calendrier, met un jour en "pause" ou coupe tout avec "actif": false.
# Un jour déjà publié ne l'est jamais deux fois (accusés chiffrés).

on:
  schedule:
    - cron: '41 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  jour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_AUTO_YOUTUBE: ${{ vars.VM_AUTO_YOUTUBE }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0' pillow
      - name: Valider le script et le calendrier avant tout envoi
        run: |
          python -m py_compile tools/publier_campagne_du_jour.py
          python -c "import json; json.load(open('campagnes/calendrier.json'))"
      - name: Retrouver les accusés chiffrés (aucun secret affiché)
        env:
          STATE_DIR: ${{ runner.temp }}/vm-broadcast-state
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c credential.helper='!gh auth git-credential' ls-remote --exit-code "$url" refs/heads/broadcast-state > /dev/null; then
            git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$url" "$STATE_DIR"
          else
            echo "::error::Branche chiffrée broadcast-state absente"
            exit 1
          fi
      - name: Publier le contenu du jour
        run: python tools/publier_campagne_du_jour.py --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
      - name: Enregistrer les liens publics dans campagnes/journal.json
        if: always()
        run: |
          set -euo pipefail
          [ -f campagnes/journal.json ] || exit 0
          save_file=$(mktemp)
          cp campagnes/journal.json "$save_file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard -q origin/main
            cp "$save_file" campagnes/journal.json
            git add campagnes/journal.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm 'Campagne du jour : liens publics'
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
