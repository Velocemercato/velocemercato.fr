name: Actualites football - toutes les 30 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: publication-actualites
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les nouvelles breves
        run: python update_news.py
      - name: Verifier le JSON
        run: python -m json.tool articles.json > /dev/null
      - name: Enregistrer seulement si des articles ont change
        run: |
          if git diff --quiet -- articles.json; then
            echo 'Aucun nouvel article a publier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.json
          git commit -m 'Actualiser les breves football'
          git push
