name: Veloce Mercato - Actualites

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Mode test (2 brèves maximum)'
        type: boolean
        default: true
      rattrapage:
        description: 'Rattrapage : actus des 7 derniers jours'
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: actualites
  cancel-in-progress: false

jobs:
  actualites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          echo "Passage du $(date -u '+%Y-%m-%d %H:%M UTC') (${{ github.event_name }})" > robot-log.txt
          pip install --quiet trafilatura 2>&1 | tail -3 | tee -a robot-log.txt

      - name: Remove empty old briefs
        run: |
          python - <<'EOF' 2>&1 | tee -a robot-log.txt
          import json
          rows = json.load(open('articles.json', encoding='utf-8'))
          keep = [a for a in rows if 'Consultez la source' not in str(a.get('texte', ''))
                  and 'uniquement sur le titre' not in str(a.get('texte', ''))]
          if len(keep) != len(rows):
              open('articles.json', 'w', encoding='utf-8').write(json.dumps(keep, ensure_ascii=False, indent=2) + '\n')
          print(f'Nettoyage : {len(rows) - len(keep)} breves vides retirees, {len(keep)} gardees.')
          EOF

      - name: Check API key (sans l'afficher)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERREUR : le secret ANTHROPIC_API_KEY est absent." | tee -a robot-log.txt
            exit 1
          fi
          echo "Secret ANTHROPIC_API_KEY present (${#ANTHROPIC_API_KEY} caracteres)." | tee -a robot-log.txt

      - name: Update news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
          VM_RATTRAPAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.rattrapage && '1' || '' }}
        run: |
          set -o pipefail
          python update_news.py 2>&1 | tee -a robot-log.txt

      - name: Build article pages
        if: always()
        run: python build_pages.py 2>&1 | tee -a robot-log.txt

      - name: Update agenda (matchs de la semaine)
        if: always()
        continue-on-error: true
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python update_agenda.py 2>&1 | tee -a robot-log.txt

      - name: Update videos (chaînes YouTube officielles)
        if: always()
        continue-on-error: true
        run: python update_videos.py 2>&1 | tee -a robot-log.txt

      - name: Fil express (titres de la presse, sans IA, gratuit)
        if: always()
        continue-on-error: true
        run: python update_fil.py 2>&1 | tee -a robot-log.txt

      - name: Validate JSON
        id: validate
        if: always()
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool flash.json > /dev/null

      - name: Save articles, flashs and report
        if: always() && steps.validate.outcome == 'success'
        run: |
          git add articles.json flash.json robot-log.txt sitemap.xml a/ videos.json video-channels.json matchs.json fil.json ignores.json
          if git diff --cached --quiet; then
            echo 'Rien de nouveau.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update football news'
            if git pull --rebase origin main && git push; then
              echo 'Publié.'
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning::Un autre passage a publié en même temps ; ces brèves seront refaites au prochain passage."
            fi
          fi
