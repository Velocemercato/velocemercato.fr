name: Veille football - TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tester la collecte
        run: python update_news.py

      - name: Afficher le resultat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("articles.json")
          articles = json.loads(path.read_text(encoding="utf-8"))
          veille = [a for a in articles if a.get("format") == "veille"]

          print("Articles dans le fichier de test :", len(articles))
          print("Fiches de veille detectees :", len(veille))
          for article in veille[:10]:
              print(article.get("zone"), "-", article.get("titre"))
          PY

      - name: Verifier les changements sans publier
        run: |
          git status --short
          echo "TEST TERMINE : aucun commit ni push effectue."
