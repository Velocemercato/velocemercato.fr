name: Veille football
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veille-football
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les nouvelles sources
        run: python update_news.py
      - name: Enregistrer les nouvelles entrées
        run: |
          if ! git diff --quiet -- articles.json; then
            git config user.name 'Veloce Mercato Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add articles.json
            git commit -m 'Veille automatique football'
            git push
          fi
