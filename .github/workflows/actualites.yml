
Name: Football News - every 30 minutes

on:
workflow_dispatch:
Calendar:
- cron: '*/30 * *' Works every 30 minutes

Permissions:
Content: writing

Competition:
Group: Publication - News
Cancellation in progress: False

Jobs:
Publish:
Run-on: Ubuntu - Last
Time out - 10 minutes
Steps:
Name: Retrieve Deposit
uses: actions/checkout@v4
To:
Persistence - Claims: True
Name: Install Python
uses: actions/setup-python@v5
To:
Python version: '3.12'
Name: Collecting the new patents
Run: Python update_news.py
Name: Check the JSON
run: python -m json.tool articles.json > /dev/null
- name: Save only if items have changed
Running: |
If it is different - silent - articles.json; then
Echo 'No new articles have been published.'
Output 0
Fi
git config user.name 'github-actions[bot]'
git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
Add articles.json
git commit - m 'Update football briefs'
Push with Git
