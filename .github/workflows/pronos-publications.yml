name: VM - RQ Pronos publications (apres test confirme)

on:
  workflow_run:
    # Secours : si GitHub retarde un cron, la fin d'un robot d'actualité
    # relance la vérification du créneau, sans renvoyer un post déjà accusé.
    workflows:
      - 'Veloce Mercato - Actualites'
      - 'VM Actus - Actualites'
      - 'VM Gaming - Actualites'
      - 'VM Studio - La Pastille TV'
    types: [completed]
    branches: [main]
  schedule:
    # UTC : le script applique les horaires Europe/Paris.
    - cron: '25 5-21 * * *'  # actus dès 7h Paris hiver/été
    - cron: '40 8-21 * * *'  # prono fictif 10h40 et bilan du soir 22h40 Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  publications:
    # Un robot source en échec ne peut pas provoquer de diffusion.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Active avec autorisation utilisateur : le script refuse si le test Facebook n'est pas confirme.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_FACEBOOK_PRONOS_PAGE_ID: ${{ vars.VM_FACEBOOK_PRONOS_PAGE_ID }}
      VM_AUTO_PRONOS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0'
      - name: Verifier ID Facebook RQ Pronos
        run: |
          test "$VM_FACEBOOK_PRONOS_PAGE_ID" = '112294796981981' || {
            echo "::error::RQ Pronos : mauvais identifiant de Page"; exit 1;
          }
      - name: Verifier code sans publier
        run: |
          python -m py_compile tools/pronos_programme.py
          python -m unittest discover -s tests -p 'test_pronos_programme.py' -v
      - name: Recuperer etat chiffre existant
        run: |
          set -euo pipefail
          repo_url="https://github.com/$GITHUB_REPOSITORY.git"
          state_dir="$RUNNER_TEMP/vm-broadcast-state"
          git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$repo_url" "$state_dir"
          test -f "$state_dir/state.enc" || {
            echo "::error::Etat chiffre absent : aucune publication autorisee."; exit 1;
          }
      - name: Publier au plus une information verifiee
        env:
          VM_TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          python tools/pronos_programme.py --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
