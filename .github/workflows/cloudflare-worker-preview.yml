name: Preview homepage fix
on:
  push:
    branches: [codex/masque-une]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref_name == 'codex/masque-une'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare/masque-une
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check worker.mjs && node --check kit-reseaux.mjs && node --check live-data.mjs && node --check logo.mjs
      - name: Deploy homepage Worker without changing routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c5227875896e9a281915ed70c146e845
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_WORKER_API_TOKEN is missing"
            exit 1
          fi
          npx --yes wrangler@4 versions upload | tee /tmp/veloce-upload.log
          version=$(sed -nE 's/.*Worker Version ID: ([0-9a-f-]{36}).*/\1/p' /tmp/veloce-upload.log | tail -n1)
          test -n "$version"
          npx --yes wrangler@4 versions deploy "$version@100%" -y
      - name: Verify the public preview
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://vm-masque-une.velocemercato87.workers.dev/ -o /tmp/veloce-preview.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://velocemercato.fr/ -o /tmp/veloce-production.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 'https://vm-masque-une.velocemercato87.workers.dev/?site=vmunivers' -o /tmp/vmunivers-preview.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 'https://vm-masque-une.velocemercato87.workers.dev/kit-reseaux-vm' -o /tmp/vm-kit.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 'https://vm-masque-une.velocemercato87.workers.dev/web-studio' -o /tmp/vm-studio-preview.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 'https://vm-masque-une.velocemercato87.workers.dev/fil.json' -o /tmp/vm-live-fil.json
          curl --fail --silent --show-error --max-time 15 'https://vm-masque-une.velocemercato87.workers.dev/assets/vm-logo-optimized.webp' -o /tmp/vm-logo.webp
          test "$(wc -c < /tmp/vm-logo.webp)" -lt 40000
          test "$(curl -s -o /dev/null -w '%{http_code}' 'https://vm-masque-une.velocemercato87.workers.dev/vm-page-inexistante-404?site=vmunivers')" = 404
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Ids(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.shortcuts = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'vm-mobile-hub' in attrs.get('class', '').split():
                      self.shortcuts.add(attrs.get('href'))
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
          for filename in ('veloce-preview.html', 'veloce-production.html'):
              page = Ids()
              page.feed(Path('/tmp', filename).read_text())
              assert 'actualites-du-jour' not in page.ids, filename
              assert {'vm-readable-scores', 'vm-home-mobile'} <= page.ids, filename
              assert {'#feed-title', '#pastille-tv', '/belfort/'} == page.shortcuts, filename
              assert {'feed', 'pastille-tv'} <= page.ids, filename
              assert 'href="#actualites-du-jour"' not in Path('/tmp', filename).read_text()
              print('Verified', filename)
          univers = Ids()
          univers.feed(Path('/tmp/vmunivers-preview.html').read_text())
          assert {'edition-vm', 'edition-titre', 'vm-home-mobile'}.isdisjoint(univers.ids)
          assert {'projets', 'vitrine'} <= univers.ids
          print('VM Univers edition removed in preview, directory and project showcase retained.')
          import json
          assert isinstance(json.loads(Path('/tmp/vm-live-fil.json').read_text())['titres'], list)
          assert 'vm-live-bootstrap' in Path('/tmp/veloce-production.html').read_text()
          kit = Path('/tmp/vm-kit.html').read_text()
          assert kit.count('data-action="copy"') == 4 and kit.count('data-action="image"') == 4
          studio = Ids()
          studio.feed(Path('/tmp/vm-studio-preview.html').read_text())
          assert {'publicite-vm', 'tarifs', 'devis'} <= studio.ids
          PY
