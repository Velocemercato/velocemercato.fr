name: Verify public links for the Veloce kit
on:
  push:
    branches: [codex/kit-liens]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          python - <<'PY'
          import urllib.request, concurrent.futures
          targets = {
              'pub': ('https://velocemercato.fr/pub/', 'id="packs"'),
              'studio': ('https://velocemercato.fr/web-studio.html', 'id="devis"'),
              'univers': ('https://vmunivers.fr/', 'Véloce Universe'),
              'foot': ('https://velocemercato.fr/', 'id="feed"'),
              'multisport': ('https://velocemercato.fr/multisport/', 'VM Multisport'),
              'gaming': ('https://velocemercato.fr/vm-gaming/', 'id="news"'),
          }
          def check(item):
              key,(url,marker)=item
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'VeloceMercato-Deployment-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      return 'LINK', key, r.status, r.url, marker in r.read().decode()
              except Exception as e:
                  return 'LINK_ERROR', key, type(e).__name__, str(e)[:120]
          with concurrent.futures.ThreadPoolExecutor() as pool:
              for row in pool.map(check,targets.items()): print(*row)
          PY
