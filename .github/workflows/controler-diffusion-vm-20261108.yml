name: VM - Confirmer les teasers et l’accès Twitch
on:
  push:
    branches: [codex/teaser-vm-20261108]
    paths: ['.github/workflows/controler-diffusion-vm-20261108.yml']

permissions:
  contents: read
concurrency:
  group: vm-releve-meta-dimanche
  cancel-in-progress: false
jobs:
  bilan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0'
      - name: Verifier l'absence d'envoi et de suppression
        run: |
          python -m py_compile tools/rapport_meta_du_jour.py
          if grep -E 'graph\.call\("(POST|DELETE)"|\.save\(' tools/rapport_meta_du_jour.py; then
            echo '::error::Rapport: écriture interdite'
            exit 1
          fi
      - name: Lire les accusés chiffrés sans les modifier
        run: |
          set -euo pipefail
          git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/vm-broadcast-state"
          test -s "$RUNNER_TEMP/vm-broadcast-state/state.enc"
      - name: Vérifier les médias Facebook et les connexions récurrentes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_BROADCASTER_ID: ${{ secrets.TWITCH_BROADCASTER_ID }}
          VM_AUTO_TWITCH: ${{ vars.VM_AUTO_TWITCH }}
          VM_AUTO_TIKTOK: ${{ vars.VM_AUTO_TIKTOK }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.publier_meta import DeliveryError, Graph, State
          path = Path(os.environ["RUNNER_TEMP"]) / "vm-broadcast-state/state.enc"
          state = State(path, os.environ["VM_DIFFUSION_STATE_KEY"], lambda: None)
          tokens = state.data.get("tokens") or {}
          twitch = tokens.get("twitch") or {}
          print("::notice::CONTROLE TWITCH mode=" + ("on" if os.getenv("VM_AUTO_TWITCH") == "true" else "off")
                + " client=" + str(bool(os.getenv("TWITCH_CLIENT_ID") and os.getenv("TWITCH_CLIENT_SECRET")))
                + " refresh=" + str(bool(twitch.get("refresh") or os.getenv("TWITCH_REFRESH_TOKEN")))
                + " chaine=" + str(bool(twitch.get("user") or os.getenv("TWITCH_BROADCASTER_ID"))))
          print("::notice::CONTROLE TIKTOK mode=" + ("on" if os.getenv("VM_AUTO_TIKTOK") == "true" else "off")
                + " identifiants=" + str(all(os.getenv(k) for k in ("METRICOOL_USER_TOKEN", "METRICOOL_USER_ID", "METRICOOL_BLOG_ID"))))
          graph = Graph()
          for account, ident in [["meta","1577775677436549"],["meta_univers","1064069423316784"]]:
              token = tokens.get(account) or {}
              try:
                  data = graph.call("GET", ident, {"fields": "id,published,permalink_url,status", "access_token": token["page_token"]})
                  print("::notice::CONTROLE VIDEO", account, data.get("id"), data.get("published"),
                        (data.get("status") or {}).get("video_status"), data.get("permalink_url"))
              except DeliveryError as error:
                  print(f"::warning::{account} : lecture vidéo impossible ({type(error).__name__})")
          PY
