name: VM - Tests du moteur éditorial Meta sans publication

on:
  push:
    paths:
      - 'tools/editorial_vm.py'
      - 'tests/test_editorial_vm.py'
      - '.github/workflows/tests-editorial-vm.yml'
  pull_request:
    paths:
      - 'tools/editorial_vm.py'
      - 'tests/test_editorial_vm.py'
      - '.github/workflows/tests-editorial-vm.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install --quiet 'cryptography==50.0.0' pillow
      - name: Vérifier la syntaxe
        run: python -m py_compile tools/editorial_vm.py
      - name: Tester les créneaux, les accusés, les identités et la compaction
        run: python -m unittest discover -s tests -p 'test_editorial_vm.py' -v
