name: VM - Facebook et Instagram automatiques

on:
  schedule:
    # Deux passages par heure, un seul envoi par source et par créneau.
    - cron: '11,36 7-23 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
    inputs:
      article:
        description: 'Publier un article tout de suite'
        type: choice
        options: ['', 'foot', 'actus', 'gaming', 'multisport', 'lancement-vmunivers', 'annonce-vm-meta-gaming', 'ballon-dor-2026']
        default: ''

permissions:
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  meta:
    if: vars.VM_AUTO_META == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_AUTO_META: ${{ vars.VM_AUTO_META }}
      ARTICLE: ${{ inputs.article }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0' pillow
      - name: Ouvrir les accusés chiffrés
        env:
          STATE_DIR: ${{ runner.temp }}/vm-broadcast-state
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c credential.helper='!gh auth git-credential' ls-remote --exit-code "$repo_url" refs/heads/broadcast-state > /dev/null; then
            git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$repo_url" "$STATE_DIR"
          else
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init --quiet -b broadcast-state
            git -C "$STATE_DIR" remote add origin "$repo_url"
          fi
      - name: Publier les pastilles et un article (si VM_AUTO_META=true)
        env:
          VM_MULTISPORT_FEED: ${{ runner.temp }}/vm-multisport.json
        run: |
          if [[ "${ARTICLE:-}" = multisport || "$(TZ=Europe/Paris date +%H)" =~ ^(10|12|15|17|21|23)$ ]]; then
            curl -fsS --max-time 10 https://velocemercato.fr/multisport/actualites.json -o "$VM_MULTISPORT_FEED" || rm -f "$VM_MULTISPORT_FEED"
          fi
          if [ "${ARTICLE:-}" = ballon-dor-2026 ]; then python tools/publier_meta.py ballon-dor --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
          elif [ "${ARTICLE:-}" = annonce-vm-meta-gaming ]; then python tools/publier_meta.py annonce --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
          elif [ "${ARTICLE:-}" = lancement-vmunivers ]; then python tools/publier_meta.py lancement --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
          else python tools/publier_meta.py publier --state "$RUNNER_TEMP/vm-broadcast-state/state.enc" --article "${ARTICLE:-}"; fi
