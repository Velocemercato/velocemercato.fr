name: VM - Facebook et Instagram automatiques

on:
  schedule:
    # Toutes les heures de 7 h à 23 h Paris (été et hiver) : articles selon le programme, pastilles dès qu'elles sont prêtes,
    # et les 4 publications VM Invest.
    - cron: '5 5-22 * * *'
  workflow_dispatch:
    inputs:
      article:
        description: 'Publier un article tout de suite'
        type: choice
        options: ['', 'foot', 'actus', 'gaming', 'lancement-vminvest']
        default: ''

permissions:
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  meta:
    if: vars.VM_AUTO_META == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_AUTO_META: ${{ vars.VM_AUTO_META }}
      ARTICLE: ${{ inputs.article }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0' pillow
      - name: Ouvrir les accusés chiffrés
        env:
          STATE_DIR: ${{ runner.temp }}/vm-broadcast-state
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c credential.helper='!gh auth git-credential' ls-remote --exit-code "$repo_url" refs/heads/broadcast-state > /dev/null; then
            git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$repo_url" "$STATE_DIR"
          else
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init --quiet -b broadcast-state
            git -C "$STATE_DIR" remote add origin "$repo_url"
          fi
      - name: Publier les pastilles et un article (si VM_AUTO_META=true)
        run: |
          if [ "${ARTICLE:-}" = lancement-vminvest ]; then python tools/publier_meta.py lancement --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
          else python tools/publier_meta.py publier --state "$RUNNER_TEMP/vm-broadcast-state/state.enc" --article "${ARTICLE:-}"; fi
