name: Check Gaming and VM Univers public sites
on:
  push:
    branches: [codex/check-gaming-univers]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the two public sites
        run: |
          python - <<'PY'
          import concurrent.futures, json, urllib.request
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  href = dict(attrs).get('href')
                  if tag == 'a' and href:
                      self.hrefs.append(href)
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'VeloceMercato-Deployment-Check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=12) as response:
                  return response.status, response.url, response.read().decode()
          def verify(label, url):
              try:
                  status, final, body = get(url)
                  if label.startswith('gaming'):
                      rows = json.loads(body)
                      dates = [item.get('publishedAt') or item.get('createdAt') or '' for item in rows]
                      return ('CHECK', label, status, final, 'count=' + str(len(rows)), 'latest=' + max(dates, default=''))
                  page = Links()
                  page.feed(body)
                  legacy = sorted({href for href in page.hrefs if '.github.io' in href or '.pages.dev' in href})
                  return ('CHECK', label, status, final, 'links=' + str(len(page.hrefs)), 'legacy=' + json.dumps(legacy))
              except Exception as e:
                  return ('CHECK_ERROR', label, type(e).__name__, str(e)[:160])
          targets = {
              'gaming-public': 'https://velocemercato.fr/vm-gaming/news.json',
              'gaming-preview': 'https://vm-rattrapage.velocemercato87.workers.dev/vm-gaming/news.json',
              'univers-public': 'https://vmunivers.fr/',
              'univers-pages': 'https://vmunivers.pages.dev/',
          }
          with concurrent.futures.ThreadPoolExecutor() as pool:
              for row in pool.map(lambda item: verify(*item), targets.items()):
                  print(*row)
          PY
