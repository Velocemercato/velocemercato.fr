name: VM Studio - La Pastille TV

on:
  workflow_dispatch:
    inputs:
      univers:
        description: Univers
        type: choice
        options: ['tous', 'foot', 'actus', 'gaming']
        default: tous
      format:
        description: Format
        type: choice
        options: ['edition', 'speciale', 'debat', 'buts']
        default: edition
      moment:
        description: Moment
        type: choice
        options: ['matin', 'midi', 'soir']
        default: soir
      publish:
        description: 'Publier après validation (uniquement sur main)'
        type: boolean
        default: false
      refaire:
        description: 'Refaire les trois éditions du créneau avec le nouveau format court'
        type: boolean
        default: false
      qualite:
        description: 'auto : CDN en production, HD en aperçu'
        type: choice
        options: ['auto', 'hd', 'cdn']
        default: auto
  schedule:
    # Préparer les JT 75 minutes avant 8 h, 12 h et 20 h Paris.
    # Deux heures UTC couvrent été/hiver ; les doublons complets sont ignorés.
    - cron: '45 4,5,8,9,16,17 * * *'
    # Rattrapage à l'heure cible ; les retards GitHub ne sont plus rejetés à :30.
    - cron: '0 6,7,10,11,18,19 * * *'
    - cron: '15,45 10-22 * * *'
    # Après-match 22 h 45 (ou 23 h 45 si le match finit tard).
    - cron: '45 20,21,22 * * *'
    # Dimanche 18 h : les buts de la semaine.
    - cron: '0 16,17 * * 0'

permissions:
  contents: write

concurrency:
  group: emissions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Planifier en heure de Paris
        id: plan
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          PLAN=$(python pastille_schedule.py "$CRON")
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$PLAN" ]; then
            echo 'Aucune nouvelle émission à cette heure de Paris : les étapes de production sont volontairement ignorées.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Vérifier la connexion des plateformes longues
        id: diffusion
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.plan != ''
        env:
          VM_AUTO_YOUTUBE: ${{ vars.VM_AUTO_YOUTUBE }}
          VM_AUTO_TWITCH: ${{ vars.VM_AUTO_TWITCH }}
          VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_BROADCASTER_ID: ${{ secrets.TWITCH_BROADCASTER_ID }}
        run: |
          python tools/diffuser_jt.py --check > "$RUNNER_TEMP/diffusion-check.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/diffusion-check.json'))
          print('ready=' + ('1' if data['ready'] else '0'))
          PY
      - name: Installer les outils sans repli vocal silencieux
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.plan != ''
        run: |
          bash tools/installer_ffmpeg.sh
          python -m pip install "piper-tts==1.8.0" pillow
          python -m piper --help > /dev/null
      - name: Cache des voix
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.plan != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/vm-voices
          key: vm-voices-piper-1-8-v2
      - name: Produire les émissions ou un aperçu
        id: produce
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.plan != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VM_PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) && '1' || '0' }}
          VM_SPEECH_RATE: '1.12'
          VM_VIDEO_PROFILE: ${{ inputs.qualite || 'auto' }}
          VM_KEEP_HD_MASTER: ${{ steps.diffusion.outputs.ready == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) && '1' || '0' }}
          VM_REFRESH_EDITION: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.refaire && '1' || '0' }}
          PLAN: ${{ steps.plan.outputs.plan }}
          UNIVERS: ${{ inputs.univers }}
          FORMAT: ${{ inputs.format }}
          MOMENT: ${{ inputs.moment }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$UNIVERS" = "tous" ]; then
              if [ "$FORMAT" != "edition" ]; then echo 'Le programme complet utilise le format edition.'; exit 1; fi
              python update_emission.py plan "$MOMENT" 2>&1 | tee studio/emission-log.txt
              if [ "$VM_PUBLISH" = "0" ]; then python tools/assembler_jt.py --moment "$MOMENT"; fi
            else
              python update_emission.py "$UNIVERS" "$FORMAT" "$MOMENT" 2>&1 | tee studio/emission-log.txt
            fi
          else
            python update_emission.py plan "$PLAN" 2>&1 | tee studio/emission-log.txt
          fi
      - name: Autoriser uniquement les programmes complets de production
        if: success() && steps.diffusion.outputs.ready == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        env:
          PLAN: ${{ steps.plan.outputs.plan || inputs.moment }}
          FORMAT: ${{ inputs.format }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc)
          folder = Path('studio/tmp/masters')
          videos = list(folder.glob('*.mp4'))
          if not videos:
              print('Aucun nouvel original HD : aucune nouvelle diffusion.')
              raise SystemExit(0)
          kind = os.environ['PLAN'] if os.environ['PLAN'] in ('speciale','debat','buts') else os.environ.get('FORMAT') or 'edition'
          expected = 1 if kind in ('speciale','debat','buts') else 3
          if len(videos) != expected:
              raise SystemExit('Lot HD incomplet : aucun ancien JT réutilisé.')
          (folder / '_autorisation.json').write_text(json.dumps({
              'publish': True, 'created': now.isoformat(), 'date': now.astimezone(ZoneInfo('Europe/Paris')).date().isoformat(),
              'format':kind, 'unit':videos[0].stem if expected == 1 else None,
              'moment': 'soir' if kind in ('speciale','debat','buts') else os.environ['PLAN'], 'run_id': os.environ['GITHUB_RUN_ID']}))
          PY
      - name: Transmettre les originaux HD à la diffusion autorisée
        if: success() && hashFiles('studio/tmp/masters/_autorisation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pastille-masters
          path: |
            studio/tmp/masters/*.mp4
            studio/tmp/masters/*.json
          retention-days: 2
      - name: Conserver les aperçus sans publication
        if: always() && github.event_name == 'workflow_dispatch' && (!inputs.publish || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: pastille-apercus
          path: |
            studio/tmp/*
            !studio/tmp/masters/
          if-no-files-found: warn
      - name: Conserver les rendus qui attendent un hébergement adapté
        if: always() && hashFiles('studio/tmp/a-heberger/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pastille-a-heberger
          path: studio/tmp/a-heberger/
          retention-days: 2
          if-no-files-found: error
      - name: Enregistrer les émissions validées
        if: always() && steps.produce.outcome != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) && (github.event_name == 'workflow_dispatch' || steps.plan.outputs.plan != '')
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SAVE_DIR=$(mktemp -d)
          git status --porcelain -uall studio/tv studio/episodes studio/emission-log.txt | cut -c4- > "$SAVE_DIR/list.txt"
          while IFS= read -r file; do
            if [ -f "$file" ]; then mkdir -p "$SAVE_DIR/files/$(dirname "$file")"; cp "$file" "$SAVE_DIR/files/$file"; fi
          done < "$SAVE_DIR/list.txt"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -qfd studio
            if [ -d "$SAVE_DIR/files" ]; then cp -r "$SAVE_DIR/files/." ./; fi
            python update_emission.py liste
            git add studio/tv studio/episodes studio/emission-log.txt studio/emissions.json
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -qm 'La Pastille TV : émission, partage et liste à jour'
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*5))
          done
          [ "$ok" = 1 ] || { echo 'Publication de la liste impossible'; exit 1; }
