name: Resultats en direct

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 10-23 * * *'   # relance régulière ; chaque passage surveille les scores pendant ~50 minutes

permissions:
  contents: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Surveiller les scores toutes les 2 minutes (football-data.org) et notifier Discord
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in $(seq 1 25); do
            git pull -q --rebase origin main || true
            python update_scores.py
            if [ -f scores.json ] && ! git diff --quiet -- scores.json; then
              git add scores.json
              git commit -qm 'Résultats en direct'
              for t in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 4; done
            fi
            sleep 110
          done
