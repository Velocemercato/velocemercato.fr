name: VM - YouTube et Twitch automatiques

on:
  workflow_run:
    workflows: ['VM Studio - La Pastille TV']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Relancer la diffusion d’une émission déjà validée (numéro du lancement La Pastille TV)'
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  diffusion:
    if: (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && (vars.VM_AUTO_YOUTUBE == 'true' || vars.VM_AUTO_TWITCH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      VM_AUTO_YOUTUBE: ${{ vars.VM_AUTO_YOUTUBE }}
      VM_AUTO_TWITCH: ${{ vars.VM_AUTO_TWITCH }}
      VM_YOUTUBE_PUBLIC: ${{ vars.VM_YOUTUBE_PUBLIC }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
      TWITCH_BROADCASTER_ID: ${{ secrets.TWITCH_BROADCASTER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les accès sans afficher les secrets
        id: access
        run: |
          python tools/diffuser_jt.py --check > "$RUNNER_TEMP/diffusion-check.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/diffusion-check.json'))
          print('ready=' + ('true' if data['ready'] else 'false'))
          PY
      - name: Récupérer seulement les originaux du lancement déclencheur
        if: steps.access.outputs.ready == 'true'
        id: masters
        env:
          MASTERS: ${{ runner.temp }}/pastille-masters
        run: |
          set -euo pipefail
          # Aucun artefact pour les spéciales, les aperçus ou les éditions incomplètes.
          # Relance manuelle : uniquement un lancement réussi de La Pastille TV sur main.
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '(.name == "VM Studio - La Pastille TV" and .head_branch == "main" and .conclusion == "success")')
          if [ "$ok" != true ]; then echo 'Lancement source refusé.'; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "pastille-masters" and .expired == false)] | length')
          if [ "$count" = 0 ]; then echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pastille-masters --dir "$MASTERS"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Installer les outils de diffusion
        if: steps.masters.outputs.ready == 'true'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg > /dev/null && command -v ffprobe > /dev/null; then exit 0; fi
          for attempt in 1 2 3; do
            if timeout 240 sudo -E apt-get update -qq && timeout 300 sudo -E apt-get install -y -qq --no-install-recommends ffmpeg; then exit 0; fi
            sleep $((attempt*10))
          done
          exit 1
          python -m pip install 'cryptography==50.0.0'
      - name: Ouvrir les accusés chiffrés hors du site
        if: steps.masters.outputs.ready == 'true'
        env:
          STATE_DIR: ${{ runner.temp }}/vm-broadcast-state
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c credential.helper='!gh auth git-credential' ls-remote --exit-code "$repo_url" refs/heads/broadcast-state > /dev/null; then
            git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$repo_url" "$STATE_DIR"
          else
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init --quiet -b broadcast-state
            git -C "$STATE_DIR" remote add origin "$repo_url"
          fi
      - name: Assembler, publier YouTube et diffuser Twitch
        if: steps.masters.outputs.ready == 'true'
        run: python tools/diffuser_jt.py --masters "$RUNNER_TEMP/pastille-masters" --state "$RUNNER_TEMP/vm-broadcast-state/state.enc" --git-state
      - name: Sauvegarder seulement les liens publics confirmés
        if: always() && steps.masters.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ ! -f studio/diffusions.json ]; then exit 0; fi
          save_file=$(mktemp)
          cp studio/diffusions.json "$save_file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset --hard -q origin/main
            # Préserver également les autres programmes ajoutés entre-temps.
            python - "$save_file" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path('studio/diffusions.json')
          old = json.loads(path.read_text()) if path.exists() else []
          new = json.load(open(sys.argv[1]))
          rows = {row['id']: row for row in old}
          for row in new: rows[row['id']] = row
          path.write_text(json.dumps(sorted(rows.values(), key=lambda row: (row.get('date_publication', row.get('date','')), row['id']), reverse=True)[:90], ensure_ascii=False, indent=1) + '\n')
          PY
            git add studio/diffusions.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm 'Liens des diffusions YouTube et Twitch confirmées'
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
