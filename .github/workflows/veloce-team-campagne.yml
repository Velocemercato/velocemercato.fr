name: VM - Campagne VÉLOCE TEAM (essai privé puis publication unique)
# Lancement manuel uniquement. « essai » : aucune publication Meta, Short YouTube envoyé en privé.
# « publier » : exige un essai réussi ; chaque publication n'a lieu qu'une seule fois (accusés chiffrés).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'essai (privé, sans publication Meta) ou publier'
        type: choice
        options: [essai, publier]
        default: essai

permissions:
  contents: write

concurrency:
  group: vm-diffusion-longue
  cancel-in-progress: false

jobs:
  campagne:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_AUTO_YOUTUBE: ${{ vars.VM_AUTO_YOUTUBE }}
      # Comme les Shorts du JT : publication publique demandée par le propriétaire pour cette campagne.
      VM_YOUTUBE_PUBLIC: 'true'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0'
      - name: Valider le script avant tout envoi
        run: python -m py_compile tools/publier_veloce_team.py
      - name: Retrouver les accusés chiffrés (aucun secret affiché)
        env:
          STATE_DIR: ${{ runner.temp }}/vm-broadcast-state
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c credential.helper='!gh auth git-credential' ls-remote --exit-code "$url" refs/heads/broadcast-state > /dev/null; then
            git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$url" "$STATE_DIR"
          else
            echo "::error::Branche chiffrée broadcast-state absente"
            exit 1
          fi
      - name: Campagne VÉLOCE TEAM (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
        run: python tools/publier_veloce_team.py --mode "$MODE" --state "$RUNNER_TEMP/vm-broadcast-state/state.enc"
