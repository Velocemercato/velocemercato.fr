name: VM - Tests des garde-fous Meta

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/editorial_vm.py'
      - 'tools/publier_meta.py'
      - 'tools/multisport_flux.py'
      - 'tests/test_editorial_vm.py'
      - '.github/workflows/test-editorial-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-editorial-meta-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install --quiet 'cryptography==50.0.0' pillow
      - name: Exécuter les tests Meta sans connexion ni publication
        run: python -m unittest discover -s tests -p 'test_editorial_vm.py' -v
