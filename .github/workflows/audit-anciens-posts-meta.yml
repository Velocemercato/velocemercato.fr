name: VM - Inventaire Facebook AVANT 2026 SANS suppression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-anciens-posts-meta.yml', 'tools/audit_rq_pronos_posts.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-meta-audit-only
  cancel-in-progress: false

jobs:
  inventaire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
      VM_FACEBOOK_PRONOS_PAGE_ID: ${{ vars.VM_FACEBOOK_PRONOS_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer lecture d'etat chiffre
        run: python -m pip install --quiet 'cryptography==50.0.0'
      - name: Verifier qu'aucun code de suppression ne se trouve dans l'audit
        run: |
          python -m py_compile tools/audit_rq_pronos_posts.py
          if grep -F 'graph.call("DELETE"' tools/audit_rq_pronos_posts.py; then
            echo "::error::Un appel de suppression est interdit dans l'audit."
            exit 1
          fi
      - name: Lire l'etat chiffre sans le changer
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "$url" "$RUNNER_TEMP/vm-broadcast-state"
          test -s "$RUNNER_TEMP/vm-broadcast-state/state.enc"
      - name: Compter les posts avant 2026 sans suppression
        run: python tools/audit_rq_pronos_posts.py
