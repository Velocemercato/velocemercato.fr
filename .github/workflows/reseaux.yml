name: VM - Kit réseaux des JT
# Après chaque JT publié : version verticale (TikTok, Reels, Shorts) + texte prêt à coller,
# rangés sur la page studio/reseaux.html.

on:
  workflow_run:
    workflows: ['VM Studio - La Pastille TV']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Numéro du lancement La Pastille TV dont il faut reprendre les originaux (facultatif)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['tools/reseaux_jt.py', '.github/workflows/reseaux.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: reseaux
  cancel-in-progress: false

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Chercher les JT pas encore préparés
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          em = json.loads(pathlib.Path('studio/emissions.json').read_text(encoding='utf-8'))
          p = pathlib.Path('studio/reseaux.json')
          known = {e['id'] for e in json.loads(p.read_text(encoding='utf-8'))} if p.is_file() else set()
          new = [e for e in em if e.get('publie') in (True, 'True') and e.get('fichier') and e['id'] not in known]
          print(f"nouveaux={len(new)}")
          PY

      - name: Récupérer les originaux du JT (diffusés seulement sur YouTube)
        id: masters
        if: github.event_name == 'workflow_run' || inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "pastille-masters" and .expired == false)] | length')
          if [ "$count" = 0 ]; then echo 'ready=0' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pastille-masters --dir "$RUNNER_TEMP/masters"
          ls "$RUNNER_TEMP/masters"/*.mp4 > /dev/null 2>&1 && echo 'ready=1' >> "$GITHUB_OUTPUT" || echo 'ready=0' >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.check.outputs.nouveaux != '0' || steps.masters.outputs.ready == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer FFmpeg et Pillow
        if: steps.check.outputs.nouveaux != '0' || steps.masters.outputs.ready == '1'
        run: |
          bash tools/installer_ffmpeg.sh
          python -m pip install --quiet pillow

      - name: Préparer les vidéos verticales et les textes
        if: steps.check.outputs.nouveaux != '0' || steps.masters.outputs.ready == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.masters.outputs.ready }}" = 1 ]; then python tools/reseaux_jt.py --limit 6 --local "$RUNNER_TEMP/masters"; else python tools/reseaux_jt.py --limit 6; fi

      - name: Enregistrer la liste
        if: steps.check.outputs.nouveaux != '0' || steps.masters.outputs.ready == '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m json.tool studio/reseaux.json > /dev/null
          cp studio/reseaux.json "$RUNNER_TEMP/reseaux.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/reseaux.json" studio/reseaux.json
            git add studio/reseaux.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -qm 'Kit réseaux : vidéos verticales et textes des JT'
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          echo 'Publication de la liste impossible'; exit 1
