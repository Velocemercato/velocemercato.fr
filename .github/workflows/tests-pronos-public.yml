name: VM - Tests des actualites publiques RQ Pronos (sans publication)
on:
  pull_request:
    paths:
      - 'tools/pronos_public.py'
      - 'tools/prepare_public_site.py'
      - 'tools/pronos_programme.py'
      - 'build_pages.py'
      - 'pronos/index.html'
      - 'tests/test_pronos_public.py'
      - '.github/workflows/tests-pronos-public.yml'
  push:
    branches: [main]
    paths:
      - 'tools/pronos_public.py'
      - 'build_pages.py'
      - 'tests/test_pronos_public.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests hors ligne sans jeton ni appel Meta
        run: |
          python -m py_compile tools/pronos_public.py tools/prepare_public_site.py tools/pronos_programme.py build_pages.py
          python -m unittest discover -s tests -p 'test_pronos_public.py' -v
          python -m unittest discover -s tests -p 'test_pronos_programme.py' -v
