name: VM - Tests YouTube Twitch sans publication

on:
  push:
    paths:
      - 'tools/diffuser_jt.py'
      - 'tools/connecter_diffusion.py'
      - 'tools/promos_youtube.py'
      - 'tools/assembler_jt.py'
      - 'pastille_media.py'
      - 'tools/installer_ffmpeg.sh'
      - 'tests/test_diffusion.py'
      - '.github/workflows/*diffusion.yml'
  pull_request:
    paths:
      - 'tools/installer_ffmpeg.sh'
      - 'tools/*diffusion*.py'
      - 'tools/diffuser_jt.py'
      - 'tests/test_diffusion.py'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache des outils vidéo autonomes
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vm-ffmpeg-8.1-gpl
          key: ffmpeg-linux-x64-8-1-gpl-v1
      - run: |
          bash tools/installer_ffmpeg.sh
          python -m pip install 'cryptography==50.0.0'
      - run: python tests/test_diffusion.py
