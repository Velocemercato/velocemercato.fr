name: VM - Tests YouTube Twitch sans publication

on:
  push:
    paths:
      - 'tools/diffuser_jt.py'
      - 'tools/connecter_diffusion.py'
      - 'tools/promos_youtube.py'
      - 'tools/assembler_jt.py'
      - 'pastille_media.py'
      - 'tests/test_diffusion.py'
      - '.github/workflows/*diffusion.yml'
  pull_request:
    paths:
      - 'tools/*diffusion*.py'
      - 'tools/diffuser_jt.py'
      - 'tests/test_diffusion.py'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'cryptography==50.0.0'
      - run: python tests/test_diffusion.py
