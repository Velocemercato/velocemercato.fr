name: VM - Tests lancement Facebook Instagram sans publication

on:
  push:
    paths:
      - 'tools/publier_meta.py'
      - 'tests/test_lancement_meta.py'
      - '.github/workflows/tests-meta.yml'
  pull_request:
    paths:
      - 'tools/publier_meta.py'
      - 'tests/test_lancement_meta.py'
      - '.github/workflows/tests-meta.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/publier_meta.py
      - run: python -m unittest discover -s tests -p test_lancement_meta.py -v
