# Vérification demandée pour la diffusion du nouveau JT, 16 novembre 2026.
name: VM - Releve quotidien des liens Meta (LECTURE SEULE)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rapport-meta-du-jour.yml', 'tools/rapport_meta_du_jour.py']
  schedule:
    # Relevés après les créneaux éditoriaux, en lecture seule.
    - cron: '55 8,12,18,21 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-releve-meta-dimanche
  cancel-in-progress: false
jobs:
  bilan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VM_DIFFUSION_STATE_KEY: ${{ secrets.VM_DIFFUSION_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==50.0.0'
      - name: Verifier l'absence d'envoi et de suppression
        run: |
          python -m unittest discover -s tests -p 'test_rapport_meta_du_jour.py' -v
          if grep -E 'graph\.call\("(POST|DELETE)"|\.save\(' tools/rapport_meta_du_jour.py; then
            echo '::error::Rapport: écriture interdite'
            exit 1
          fi
      - name: Lire les accusés chiffrés sans les modifier
        run: |
          set -euo pipefail
          git -c credential.helper='!gh auth git-credential' clone --quiet --depth 1 --branch broadcast-state "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/vm-broadcast-state"
          test -s "$RUNNER_TEMP/vm-broadcast-state/state.enc"
      - name: Récupérer seulement les liens publics existants
        run: python tools/rapport_meta_du_jour.py
