name: VM - Bibliotheque VF (controle quotidien des liens officiels)

# Lecture seule des métadonnées publiques YouTube (oEmbed + page publique).
# Aucun téléchargement, aucune publication sur les réseaux, aucun secret utilisé.
on:
  pull_request:
    paths:
      - 'bibliotheque-vf/liens.json'
      - 'tools/verifier_vf.py'
      - '.github/workflows/vm-bibliotheque-vf.yml'
  schedule:
    - cron: '17 4 * * *'  # 5 h 17 / 6 h 17 à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vm-bibliotheque-vf
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests hors ligne
        run: python -m unittest tests/test_bibliotheque_vf.py -v
      - name: Controle des liens (rapport)
        run: |
          python tools/verifier_vf.py --ecrire | tee "$RUNNER_TEMP/rapport.md"
          {
            echo '## Bibliothèque VF — contrôle du jour'
            cat "$RUNNER_TEMP/rapport.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer le journal de verification (main uniquement)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- bibliotheque-vf/verifications.json || [ -n "$(git status --porcelain bibliotheque-vf/verifications.json)" ]; then
            git add bibliotheque-vf/verifications.json
            git commit -qm 'Bibliothèque VF : contrôle quotidien des liens'
            for t in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 4; done
          fi
